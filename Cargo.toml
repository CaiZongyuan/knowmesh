[workspace]
members = ["crates/knowmesh-core", "crates/knowmesh-sqlite", "crates/knowmesh"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/CaiZongyuan/knowmesh"

[workspace.dependencies]
knowmesh-core = { path = "crates/knowmesh-core" }
knowmesh-sqlite = { path = "crates/knowmesh-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
secrecy = "0.10"
fs2 = "0.4"
schemars = { version = "1", features = ["chrono04"] }
thiserror = "2"
ulid = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
proptest = "1"
assert_cmd = "2"
regex = "1"
url = { version = "2", features = ["serde"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
yaml-edit = { version = "0.3", default-features = false }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "backup", "functions", "hooks", "fallible_uint"] }
unicode-normalization = "0.1"
base64 = "0.22"
syn = { version = "2", features = ["full", "visit"] }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
